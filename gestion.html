<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GestPro – Gestion commerciale</title>
  <meta name="theme-color" content="#16110e">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js" defer></script>
  <script src="motion.js" defer></script>
  <script src="vendor/supabase.js" defer></script>
  <script src="app.js" defer></script>
  <script src="gestion-caisse.js" defer></script>
  <script src="gestion-stock.js" defer></script>
  <script src="gestion-stats.js" defer></script>
</head>
<body>
  <!-- Icônes (dessinées au trait, couleur héritée du texte) -->
  <svg class="sprite" aria-hidden="true" focusable="false">
    <symbol id="i-tableau" viewBox="0 0 24 24"><path d="M4 13h6V4H4zM14 20h6v-9h-6zM4 20h6v-4H4zM14 7h6V4h-6z"/></symbol>
    <symbol id="i-caisse" viewBox="0 0 24 24"><path d="M3 10h18v10H3z"/><path d="M6 10V5h9v5M17 7h2v3M7 14h2M11 14h2M15 14h2M7 17h10"/></symbol>
    <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M6 3h12v18l-2-1.5L14 21l-2-1.5L10 21l-2-1.5L6 21z"/><path d="M9 8h6M9 12h6M9 16h3"/></symbol>
    <symbol id="i-credit" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M7 15h4"/></symbol>
    <symbol id="i-web" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 5.7 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-5.7-3.8-9S9.5 5.7 12 3z"/></symbol>
    <symbol id="i-clients" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.3-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18 14.8c1.8.7 3 2.4 3.5 5.2"/></symbol>
    <symbol id="i-produits" viewBox="0 0 24 24"><path d="M10 2h4v4l1.5 2.5V20a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2V8.5L10 6z"/><path d="M8.5 12h7"/></symbol>
    <symbol id="i-mouvements" viewBox="0 0 24 24"><path d="M7 4v16M7 20l-3-3M7 20l3-3M17 20V4M17 4l-3 3M17 4l3 3"/></symbol>
    <symbol id="i-achats" viewBox="0 0 24 24"><path d="M3 4h2l2.4 11.2a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L20 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></symbol>
    <symbol id="i-fournisseurs" viewBox="0 0 24 24"><path d="M2 7h11v10H2zM13 10h4l4 4v3h-8z"/><circle cx="6" cy="18.5" r="1.8"/><circle cx="17" cy="18.5" r="1.8"/></symbol>
    <symbol id="i-depenses" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></symbol>
    <symbol id="i-livraisons" viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></symbol>
    <symbol id="i-ventes" viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></symbol>
    <symbol id="i-rapports" viewBox="0 0 24 24"><path d="M6 2h9l5 5v15H6z"/><path d="M14 2v6h6M9 13h8M9 17h8"/></symbol>
    <symbol id="i-journal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
    <symbol id="i-utilisateurs" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></symbol>
    <symbol id="i-recherche" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></symbol>
    <symbol id="i-cloche" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 21h4"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-fermer" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-moins" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-crayon" viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/></symbol>
    <symbol id="i-corbeille" viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-imprimer" viewBox="0 0 24 24"><path d="M7 9V3h10v6M7 18H4v-8h16v8h-3"/><path d="M7 14h10v7H7z"/></symbol>
    <symbol id="i-export" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></symbol>
    <symbol id="i-boite" viewBox="0 0 24 24"><path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/></symbol>
    <symbol id="i-historique" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 3"/></symbol>
    <symbol id="i-deconnexion" viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></symbol>
    <symbol id="i-alerte" viewBox="0 0 24 24"><path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17h.01"/></symbol>
    <symbol id="i-ok" viewBox="0 0 24 24"><path d="m5 12 5 5L19 7"/></symbol>
    <symbol id="i-whatsapp" viewBox="0 0 24 24"><path d="M4 20l1.2-3.6A8 8 0 1 1 8 19z"/><path d="M9 9.5c.3 2.4 2.1 4.2 4.5 4.6l1-1.1 1.8.8-.3 1.6c-3.6.4-7.4-3.4-7-7l1.6-.3.8 1.8z"/></symbol>
  </svg>

  <!-- Annonce affichée à l'ouverture du site (voir « pub » dans config.js) -->
  <div id="pub" class="pub" hidden role="dialog" aria-label="Annonce">
    <img id="pub-fond" alt="" aria-hidden="true">
    <img id="pub-image" alt="">
    <canvas id="pub-motion" hidden aria-label="Le Paradis des Bavins : cave, boissons et épicerie fine. Tél. 01 01 92 00 57, Maroc Anador." role="img"></canvas>
    <div class="pub-voile"></div>
    <div class="pub-texte">
      <div class="pub-titre nom-entreprise">MA CAVE</div>
      <div class="pub-slogan" id="pub-slogan"></div>
    </div>
    <div class="pub-compteur"><span id="pub-secondes">10</span> s</div>
    <button type="button" class="pub-passer" id="pub-passer" hidden>Passer ›</button>
    <div class="pub-barre"><span id="pub-progression"></span></div>
  </div>

  <!-- Écran de connexion -->
  <main id="ecran-connexion" class="connexion" hidden>
    <form id="form-connexion" class="carte-connexion" autocomplete="on">
      <div class="logo">G</div>
      <h1 class="nom-entreprise">GestPro</h1>
      <p class="sous-titre">Gestion commerciale</p>
      <label>Identifiant
        <input name="identifiant" autocomplete="username" required autofocus>
      </label>
      <label>Mot de passe
        <input name="mot_de_passe" type="password" autocomplete="current-password" required>
      </label>
      <p id="erreur-connexion" class="erreur" role="alert"></p>
      <button class="btn primaire" type="submit">Se connecter</button>
      <p class="aide">Pas de compte ? Demandez à votre administrateur.</p>
    </form>
  </main>

  <!-- Application -->
  <div id="ecran-app" class="app" hidden>
    <aside class="barre" id="barre" aria-label="Menu principal">
      <div class="marque"><span class="logo petit">G</span><span class="nom-entreprise">GestPro</span>
        <button class="btn-icone fermer-menu" id="btn-fermer-menu" type="button" aria-label="Fermer le menu"><svg><use href="#i-fermer"/></svg></button></div>
      <nav id="menu"></nav>
    </aside>
    <div class="voile-menu" id="voile-menu" hidden></div>
    <div class="principal">
      <header class="haut">
        <button id="btn-menu" class="btn-icone ouvrir-menu" type="button" aria-label="Ouvrir le menu" aria-controls="barre" aria-expanded="false"><svg><use href="#i-menu"/></svg></button>
        <div class="recherche-globale" role="search">
          <svg class="loupe" aria-hidden="true"><use href="#i-recherche"/></svg>
          <label class="visuellement-cache" for="recherche-globale">Rechercher un produit, un client ou un ticket</label>
          <input id="recherche-globale" type="search" placeholder="Produit, client, n° de ticket…" autocomplete="off" aria-controls="resultats-globaux" aria-expanded="false">
          <div id="resultats-globaux" class="resultats-globaux" role="listbox" hidden></div>
        </div>
        <div class="haut-droite">
          <button class="btn-icone cloche" id="btn-notifs" type="button" aria-label="Notifications" aria-haspopup="true" aria-expanded="false" aria-controls="panneau-notifs">
            <svg><use href="#i-cloche"/></svg><span class="pastille-notif" id="nb-notifs" hidden>0</span>
          </button>
          <button class="profil-btn" id="btn-profil" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="menu-profil">
            <span class="avatar" id="avatar" aria-hidden="true">?</span>
            <span class="profil-texte"><span id="profil-nom"></span><span id="profil-role" class="role"></span></span>
          </button>
        </div>
        <section class="panneau-notifs" id="panneau-notifs" hidden aria-label="Notifications">
          <div class="panneau-tete"><h3>Notifications</h3><button class="btn petit" id="btn-tout-lu" type="button">Tout marquer comme lu</button></div>
          <div id="liste-notifs" class="liste-notifs"></div>
        </section>
        <div class="menu-profil" id="menu-profil" hidden>
          <p class="menu-profil-nom" id="menu-profil-nom"></p>
          <button id="btn-deconnexion" class="btn" type="button"><svg><use href="#i-deconnexion"/></svg> Se déconnecter</button>
        </div>
      </header>
      <main class="contenu" id="contenu">
        <div class="entete">
          <h2 id="titre-vue"></h2>
          <div id="actions-vue" class="actions"></div>
        </div>
        <section id="vue"></section>
      </main>
    </div>
  </div>

  <dialog id="dialogue">
    <form id="form-dialogue" method="dialog">
      <h3 id="dialogue-titre"></h3>
      <div id="dialogue-corps"></div>
      <p id="dialogue-erreur" class="erreur" role="alert"></p>
      <div class="pied">
        <button type="button" class="btn" id="dialogue-annuler">Annuler</button>
        <button type="submit" class="btn primaire" id="dialogue-ok">Enregistrer</button>
      </div>
    </form>
  </dialog>

  <!-- Zone d'impression (ticket de caisse, rapports) -->
  <div id="impression" class="impression" aria-hidden="true"></div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <noscript>GestPro nécessite JavaScript.</noscript>
</body>
</html>
